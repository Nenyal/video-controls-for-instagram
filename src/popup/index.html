<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Controls for Instagram</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <img src="/icons/icon32.png" alt="" width="20" height="20" />
      <h1>Video Controls</h1>
      <label class="switch" title="Enable on instagram.com">
        <input type="checkbox" id="enabled" />
        <span></span>
      </label>
    </header>

    <main id="options">
      <div class="field">
        <label for="speed">Playback speed</label>
        <select id="speed"></select>
      </div>
      <div class="field">
        <label for="seekStep">Arrow-key seek</label>
        <select id="seekStep">
          <option value="2">2 s</option>
          <option value="5">5 s</option>
          <option value="10">10 s</option>
          <option value="15">15 s</option>
        </select>
      </div>
      <div class="field">
        <label for="reelsEnd">When a reel ends</label>
        <select id="reelsEnd">
          <option value="loop">Loop</option>
          <option value="next">Play next reel</option>
          <option value="stop">Stop</option>
        </select>
      </div>
      <div class="field">
        <label for="progressLine">Thin progress line when idle</label>
        <label class="switch"><input type="checkbox" id="progressLine" /><span></span></label>
      </div>
      <div class="field">
        <label for="shortcuts">Keyboard shortcuts</label>
        <label class="switch"><input type="checkbox" id="shortcuts" /><span></span></label>
      </div>

      <details>
        <summary>Shortcuts</summary>
        <dl>
          <dt><kbd>Space</kbd> <kbd>K</kbd></dt><dd>Play / pause</dd>
          <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Seek back / forward (not on stories)</dd>
          <dt><kbd>J</kbd> <kbd>L</kbd></dt><dd>Seek ±10 s</dd>
          <dt><kbd>0</kbd>–<kbd>9</kbd></dt><dd>Jump to 0–90%</dd>
          <dt><kbd>&lt;</kbd> <kbd>&gt;</kbd></dt><dd>Slower / faster</dd>
          <dt><kbd>,</kbd> <kbd>.</kbd></dt><dd>Previous / next frame</dd>
          <dt><kbd>M</kbd></dt><dd>Mute</dd>
          <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>Volume (while hovering)</dd>
          <dt><kbd>F</kbd></dt><dd>Fullscreen</dd>
          <dt><kbd>P</kbd></dt><dd>Picture-in-picture</dd>
          <dt><kbd>R</kbd></dt><dd>Loop → next reel → stop</dd>
        </dl>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
